<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="주행거리, 차량 연비, 리터당 기름값으로 사용 기름량과 예상 주행 비용을 계산합니다."
    />
    <meta name="theme-color" content="#0f3d36" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>기름값 계산기</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="앱 헤더">
        <a class="brand" href="./" aria-label="기름값 계산기 홈">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M7 22c0-4.4 3.6-8 8-8h2.5c4.1 0 7.5-3.4 7.5-7.5" />
              <path d="M8 23.5h17" />
              <path d="M10 9h7l3 5v9H7V12a3 3 0 0 1 3-3Z" />
              <path d="M20 13h3a3 3 0 0 1 3 3v4.5a2.5 2.5 0 0 1-5 0V17" />
            </svg>
          </span>
          <span>
            <strong>기름값 계산기</strong>
            <small>주행비 예상</small>
          </span>
        </a>
        <button class="ghost-button" id="resetButton" type="button">초기화</button>
      </header>

      <section class="intro" aria-labelledby="pageTitle">
        <div>
          <h1 id="pageTitle">오늘 주행, 기름값으로 바꿔보기</h1>
          <p>거리와 내 차 연비, 리터당 가격만 넣으면 이번 주행 비용을 바로 계산합니다.</p>
        </div>
        <div class="intro-stat" aria-label="계산 기준">
          <span>계산 기준</span>
          <strong>km / km/L / 원/L</strong>
        </div>
      </section>

      <div class="workspace">
        <section class="calculator-panel" aria-labelledby="formTitle">
          <div class="section-heading">
            <h2 id="formTitle">입력</h2>
            <p id="storageHint">최근 연비와 기름값은 이 기기에 저장됩니다.</p>
          </div>

          <form id="calculatorForm" novalidate>
            <label class="field" for="distanceInput">
              <span class="field-label">주행거리</span>
              <span class="control">
                <input
                  id="distanceInput"
                  name="distance"
                  type="number"
                  inputmode="decimal"
                  min="0"
                  step="0.1"
                  placeholder="예: 6.4"
                  autocomplete="off"
                  aria-describedby="distanceUnit"
                />
                <span id="distanceUnit" class="unit">km</span>
              </span>
            </label>

            <label class="field" for="efficiencyInput">
              <span class="field-label">내 차 연비</span>
              <span class="control">
                <input
                  id="efficiencyInput"
                  name="efficiency"
                  type="number"
                  inputmode="decimal"
                  min="0"
                  step="0.1"
                  placeholder="예: 10"
                  autocomplete="off"
                  aria-describedby="efficiencyUnit"
                />
                <span id="efficiencyUnit" class="unit">km/L</span>
              </span>
            </label>

            <label class="field" for="fuelPriceInput">
              <span class="field-label">리터당 기름값</span>
              <span class="control">
                <input
                  id="fuelPriceInput"
                  name="fuelPrice"
                  type="number"
                  inputmode="decimal"
                  min="0"
                  step="1"
                  placeholder="예: 1700"
                  autocomplete="off"
                  aria-describedby="fuelPriceUnit"
                />
                <span id="fuelPriceUnit" class="unit">원/L</span>
              </span>
            </label>

            <p class="form-error" id="formError" role="alert" aria-live="assertive"></p>

            <div class="actions">
              <button class="primary-button" type="submit">계산하기</button>
            </div>
          </form>

          <div class="quick-examples" aria-label="빠른 예시">
            <button type="button" data-example-distance="6.4" data-example-efficiency="6.4" data-example-price="1700">
              6.4km 예시
            </button>
            <button type="button" data-example-distance="20" data-example-efficiency="10" data-example-price="1700">
              출퇴근 20km
            </button>
            <button type="button" data-example-distance="100" data-example-efficiency="12.5" data-example-price="1650">
              장거리 100km
            </button>
          </div>
        </section>

        <section class="result-panel" aria-labelledby="resultTitle" aria-live="polite">
          <div class="section-heading">
            <h2 id="resultTitle">결과</h2>
            <p id="summaryText">값을 입력하면 이번 주행의 예상 비용이 표시됩니다.</p>
          </div>

          <div class="result-grid">
            <article class="metric">
              <span>사용한 기름</span>
              <strong id="usedLiters">0.00 L</strong>
            </article>
            <article class="metric highlight">
              <span>예상 기름값</span>
              <strong id="totalCost">0 원</strong>
            </article>
            <article class="metric">
              <span>1km당 비용</span>
              <strong id="costPerKm">0 원/km</strong>
            </article>
          </div>

          <div class="estimate-note" role="note">
            계산 결과는 입력한 연비와 기름값을 기준으로 한 예상 금액입니다. 실제 소비량은 운전 습관, 정체,
            공회전, 날씨, 차량 상태에 따라 달라질 수 있습니다.
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
